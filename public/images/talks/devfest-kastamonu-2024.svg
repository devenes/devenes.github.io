<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <radialGradient id="spot1-14" cx="70%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2-14" cx="25%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam-14" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg-14)"/>
  <rect width="640" height="400" fill="url(#spot1-14)"/>
  <rect width="640" height="400" fill="url(#spot2-14)"/>

  <!-- Stage lighting beams -->
  <polygon points="180,0 90,340 290,340" fill="url(#beam-14)" opacity="0.55"/>
  <polygon points="460,0 350,340 560,340" fill="url(#beam-14)" opacity="0.7"/>

  <!-- Perspective stage grid -->
  <g stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="310" x2="640" y2="310"/>
    <line x1="0" y1="340" x2="640" y2="340"/>
    <line x1="0" y1="375" x2="640" y2="375"/>
    <line x1="320" y1="240" x2="40" y2="400"/>
    <line x1="320" y1="240" x2="180" y2="400"/>
    <line x1="320" y1="240" x2="320" y2="400"/>
    <line x1="320" y1="240" x2="460" y2="400"/>
    <line x1="320" y1="240" x2="600" y2="400"/>
  </g>

  <!-- Giant LED Stage Backdrop Screen -->
  <rect x="52" y="42" width="536" height="236" rx="12" fill="#070D1D" fill-opacity="0.78" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Constellation Wave inside Stage Screen -->
  <path d="M 70 214 Q 210 149, 350 204 T 570 169" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.65"/>
  <path d="M 70 239 Q 230 184, 370 229 T 570 199" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="4 5" stroke-opacity="0.45"/>

  <circle cx="210" cy="179" r="5" fill="#38BDF8"/>
  <circle cx="350" cy="204" r="6.5" fill="#F8FAFC" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="485" cy="182" r="4.5" fill="#60A5FA"/>

  <!-- Conference & Cluster Badge inside Screen -->
  <rect x="76" y="64" width="136" height="24" rx="12" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.45"/>
  <circle cx="90" cy="76" r="3.5" fill="#38BDF8"/>
  <text x="102" y="80" fill="#F8FAFC" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.2">CONFERENCE</text>

  <text x="564" y="80" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1.5">KASTAMONU · TR</text>

  <text x="76" y="130" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="2">DEVFEST KASTAMONU</text>
  <text x="76" y="162" fill="#F8FAFC" font-family="sans-serif" font-size="19" font-weight="700">Building Autonomous AI Agents with Gemini</text>

  <!-- Speaker Silhouette at Stage Podium -->
  <g transform="translate(430, 222)">
    <ellipse cx="32" cy="94" rx="48" ry="10" fill="#38BDF8" opacity="0.22"/>
    <circle cx="32" cy="18" r="11" fill="#E2E8F0"/>
    <path d="M14,68 C14,42 20,33 32,33 C44,33 50,42 50,68 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Raised gesturing arm -->
    <path d="M18,42 L-6,28" stroke="#E2E8F0" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Audience Silhouettes in Foreground -->
  <g fill="#03060C" opacity="0.92">
    <circle cx="95" cy="378" r="24"/>
    <ellipse cx="95" cy="412" rx="42" ry="22"/>
    <circle cx="195" cy="384" r="21"/>
    <ellipse cx="195" cy="415" rx="38" ry="20"/>
    <circle cx="310" cy="374" r="25"/>
    <ellipse cx="310" cy="410" rx="44" ry="24"/>
    <circle cx="535" cy="380" r="23"/>
    <ellipse cx="535" cy="412" rx="40" ry="22"/>
  </g>
</svg>